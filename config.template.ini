[user-account]
;账号密码。密码由面板以 DPAPI 加密保存在 data\cred.bin，此处留空即可
username =
password =

[browser-option]
;配置浏览器,可选 Edge 或 Chrome
driver = Edge
;指定浏览器所在路径,不填则使用默认路径
EXE_PATH =

[script-option]
;是否自动过登录时的滑块验证
enableAutoCaptcha = True
;是否自动隐藏浏览器窗口
enableHideWindow = False
;是否展示赞赏码
showDonateCode = True

[course-option]
;限制每门课程刷课时长/min (不限制:0)
limitMaxTime = 0
;限定播放倍速 (最高:1.8)
limitSpeed = 1.8
;设置是否静音播放
soundOff = True

[course-url]
;配置要学习的课程链接,支持(智慧)共享课
;可继续添加多个课程链接
URL1 =
