name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译面板
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 检查编译环境
        shell: pwsh
        run: |
          $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw '未找到 csc.exe' }
          & $csc /? | Select-Object -First 1

      - name: 编译
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 校验产物
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\AutovisorPanel.exe'
          if (-not (Test-Path $exe)) { throw '编译产物不存在' }
          $item = Get-Item $exe
          if ($item.Length -lt 10240) { throw "产物过小: $($item.Length) 字节" }
          Write-Host ("产物: {0}  {1:N0} 字节" -f $item.Name, $item.Length)
          Get-FileHash $exe -Algorithm SHA256 | Select-Object Hash

      - name: 回归测试课程进度解析
        shell: pwsh
        run: |
          $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'AutovisorProgressTests.exe'
          $sources = (Resolve-Path -LiteralPath 'src/Core.cs', 'src/CourseCatalog.cs', 'tests/ProgressTests.cs').Path
          & $csc /nologo /codepage:65001 /r:System.Security.dll /r:System.Web.Extensions.dll "/out:$exe" $sources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe
          exit $LASTEXITCODE

      - name: 上传面板
        uses: actions/upload-artifact@v4
        with:
          name: AutovisorPanel-${{ github.sha }}
          path: dist/AutovisorPanel.exe
          if-no-files-found: error
          retention-days: 30

  package:
    name: 打包分发 zip
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 获取固定版本上游发行包
        shell: pwsh
        run: |
          curl.exe --fail --location --silent --show-error --retry 3 --output upstream.zip 'https://github.com/CXRunfree/Autovisor/releases/download/3.18.4/Autovisor-3.18.4-windows-amd64.zip'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 打包
        shell: pwsh
        run: |
          .\package.ps1 -UpstreamArchive .\upstream.zip

      - name: 上传分发包
        uses: actions/upload-artifact@v4
        with:
          name: AutovisorPanel-dist
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 30
